[project]
name = "puddingknowledge-local"
version = "0.1.0"
description = "Local-only Knowledge Platform Catalog and Wiki runtime"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110.0", "uvicorn>=0.29.0", "sqlalchemy[asyncio]>=2.0.48",
  "sqlglot>=26", "python-multipart>=0.0.9", "aiosqlite>=0.22,<1",
  "cryptography>=42,<51",
  "beautifulsoup4>=4.12,<5", "html2text>=2024.2.26", "lxml>=5,<7",
  "urllib3>=2,<3", "certifi>=2024.2.2", "charset-normalizer>=3,<4",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30,<1"]
excel = [
    "openpyxl>=3.1,<4",
    "pandas>=2,<3",
    "xlrd>=2,<3",
]

[project.scripts]
puddingknowledge-local = "knowledge_platform.local.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_platform*", "knowledge_contracts*"]

[tool.setuptools.package-data]
knowledge_contracts = ["schemas/*.json"]

[dependency-groups]
dev = [
    "httpx>=0.27,<0.29",
    "jsonschema>=4,<5",
    "langchain-mcp-adapters>=0.3,<0.4",
    "openpyxl>=3.1,<4",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]

[tool.pytest.ini_options]
# Migration observers require an external legacy source fixture; keep them out
# of the default independent Platform test traversal.
norecursedirs = ["migration"]
markers = ["migration: legacy source-observer evidence requiring an external fixture"]
