[project]
name = "puddingknowledge-local"
version = "0.1.0"
description = "Local-only Knowledge Platform Catalog and Wiki runtime"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110.0", "uvicorn>=0.29.0", "sqlalchemy>=2.0.48",
  "sqlglot>=26", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30,<1"]

[project.scripts]
puddingknowledge-local = "knowledge_platform.local.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_platform*", "knowledge_contracts*"]

[tool.setuptools.package-data]
knowledge_contracts = ["schemas/*.json"]
