  frontend_and_distribution: [frontend/src/app/knowledge, frontend/src/app/analytics, electron, packages/puddingclaw-deploy-cli, docker-compose.infra.yml]
  config_and_credentials: [docs/knowledge-platform/config-credential-ownership.yaml]
  dependency_guard: [backend/tests/test_knowledge_platform_boundaries.py]
  contracts: [backend/knowledge_contracts]
  skills: [docs/knowledge-platform/skills-inventory.yaml]
  golden_baseline_registry: [docs/knowledge-platform/golden-baseline.yaml]
  vanna_vendor_baseline: [docs/knowledge-platform/vanna-baseline.yaml, docs/knowledge-platform/vanna-patch-provenance.json, backend/scripts/vanna_vendor_baseline.py, backend/scripts/vanna_vendor_patch_provenance.py, backend/tests/test_phase0a_dependency_inventory.py, backend/tests/test_vanna_entity_filters.py]
  file_classification: [docs/knowledge-platform/file-classification.yaml, backend/tests/test_knowledge_platform_boundaries.py]
