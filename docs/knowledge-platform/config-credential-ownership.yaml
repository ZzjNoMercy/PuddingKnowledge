format: agent-knowledge-platform-config-credential-ownership/v1
spec_revision: v0.7
policy:
  secret_values_may_not_cross_boundary: true
  export_only_references_or_environment_names: true
  target_secret_backend: platform-managed-vault
  legacy_behavior: "PuddingClaw keeps current storage during migration; no destructive cleanup in Phase 0."
entries:
  - key: knowledge.root_dir
    kind: filesystem-root
    current_readers: [backend/config.py, backend/knowledge/paths.py, backend/knowledge/service.py]
    current_writers: [backend/config.py, frontend/src/app/settings/page.tsx]
    secret_fields: []
    target_owner: puddingknowledge
    target_secret_backend: not-applicable
    migration: "Move to Platform workspace/blob root; PuddingClaw keeps a read-only legacy root reference during rollback."
    rotation: "Not a secret; change only through an atomic deployment revision."
    legacy_removal_version: phase-8-sidecar
  - key: knowledge.llm_wiki.retrieval.*
    kind: retrieval-runtime-config
    current_readers: [backend/config.py, backend/knowledge/llm_wiki.py, backend/knowledge/llm_wiki_embeddings.py]
    current_writers: [backend/config.py, frontend/src/app/settings/page.tsx]
    secret_fields: []
    target_owner: puddingknowledge
    target_secret_backend: not-applicable
    migration: "Move retrieval knobs to the Platform deployment config; freeze effective config in a deployment revision."
    rotation: "Not a secret; revisioned config update."
    legacy_removal_version: phase-8-sidecar
  - key: knowledge.llm_wiki.gbrain.*
    kind: optional-provider-binding
    current_readers: [backend/config.py, backend/knowledge/brain_schema.py, backend/knowledge/llm_wiki.py, backend/mcp_clients/servers.py]
    current_writers: [backend/config.py, frontend/src/app/settings/page.tsx]
    secret_fields: [provider_credential_ref]
    target_owner: puddingknowledge
    target_secret_backend: platform-managed-vault
    migration: "Move optional graph projection and provider binding to Platform; gbrain remains rebuildable and never a Wiki prerequisite."
    rotation: "Rotate through Provider Registry/Vault binding without changing Wiki source truth."
    legacy_removal_version: phase-8-sidecar
  - key: knowledge.mineru.*
    kind: parser-runtime-config
    current_readers: [backend/config.py, backend/knowledge/mineru_client.py, backend/knowledge/parsers/registry.py]
    current_writers: [backend/config.py, frontend/src/app/knowledge/page.tsx]
    secret_fields: [api_key, credential_ref]
    target_owner: puddingknowledge
    target_secret_backend: platform-managed-vault
    migration: "Keep non-secret endpoint/timeouts in Platform config; convert parser credentials to references."
    rotation: "Parser provider credential rotation with import health check."
    legacy_removal_version: phase-8-sidecar
  - key: knowledge.multimodal_index.*
    kind: index-runtime-config
    current_readers: [backend/config.py, backend/knowledge/indexer.py, backend/llm/multimodal_embedding.py]
    current_writers: [backend/config.py, frontend/src/app/knowledge/page.tsx]
    secret_fields: [provider_credential_ref]
    target_owner: puddingknowledge
    target_secret_backend: platform-managed-vault
    migration: "Move index store/model binding to Platform; active catalog/blob/vector/wiki roots are selected by one revision."
    rotation: "Provider credential rotation followed by index health check; indexes remain rebuildable."
    legacy_removal_version: phase-8-sidecar
  - key: knowledge.search.*
    kind: catalog-search-config
    current_readers: [backend/config.py, backend/knowledge/portal_search.py]
    current_writers: [backend/config.py, backend/api/knowledge.py, frontend/src/app/knowledge/page.tsx]
    secret_fields: []
    target_owner: puddingknowledge
    target_secret_backend: not-applicable
    migration: "Move directory/source search configuration to Platform Catalog Search; do not expose host absolute paths."
    rotation: "Not a secret; revisioned config update."
    legacy_removal_version: phase-8-sidecar
  - key: rag.*
    kind: retrieval-policy-config
    current_readers: [backend/config.py, backend/tools/search_knowledge_tool.py, backend/knowledge/indexer.py]
    current_writers: [backend/config.py, frontend/src/app/settings/page.tsx]
    secret_fields: [provider_credential_ref]
    target_owner: puddingknowledge
    target_secret_backend: platform-managed-vault
    migration: "Move RAG thresholds, hybrid and rerank policy to Platform; public results expose normalized Evidence only."
    rotation: "Rerank/embedding provider binding rotation with golden retrieval tests."
    legacy_removal_version: phase-8-sidecar
  - key: vanna.*
    kind: nl2sql-runtime-config
    current_readers: [backend/config.py, backend/analytics/nl2sql, backend/vanna]
    current_writers: [backend/config.py, backend/api/knowledge.py, frontend/src/app/knowledge/page.tsx]
    secret_fields: [llm.api_key, embedding.api_key, database.password_ref]
    target_owner: puddingknowledge
    target_secret_backend: platform-managed-vault
    migration: "Split model/provider and datasource bindings from NL2SQL policy; execute only signed QueryPlans."
    rotation: "Independent model and database credential rotation with query-plan invalidation."
    legacy_removal_version: phase-8-sidecar
  - key: analytics.database_qa.*
    kind: structured-query-policy-config
    current_readers: [backend/config.py, backend/analytics/nl2sql, backend/tools/database]
    current_writers: [backend/config.py, frontend/src/app/analytics/page.tsx]
    secret_fields: []
    target_owner: puddingknowledge
    target_secret_backend: not-applicable
    migration: "Move row/token/time/resource limits to Platform deployment policy; keep no Session/Run as authorization input."
    rotation: "Revisioned policy change with query and resource-limit golden tests."
    legacy_removal_version: phase-8-sidecar
  - key: knowledge.parsers.items.mineru_cloud_precise
    kind: config-and-credential-binding
    current_readers: [backend/config.py, backend/knowledge/parsers/registry.py, backend/api/knowledge.py]
    current_writers: [backend/config.py, backend/knowledge/parsers/registry.py]
    secret_fields: [api_key]
    target_owner: puddingknowledge
    target_secret_backend: platform-managed-vault
    migration: "Convert api_key to credential_ref; migrate secret value through one-time rebind, never export plaintext."
    rotation: "Platform connector credential rotation; old reference remains readable through migration window."
    legacy_removal_version: phase-8-sidecar
  - key: knowledge.parsers.items.mineru_cloud_light
    kind: config-and-credential-binding
    current_readers: [backend/config.py, backend/knowledge/parsers/registry.py, backend/api/knowledge.py]
    current_writers: [backend/config.py, backend/knowledge/parsers/registry.py]
    secret_fields: [api_key]
    target_owner: puddingknowledge
    target_secret_backend: platform-managed-vault
    migration: "Convert api_key to credential_ref; validate binding before cutover."
    rotation: "Platform connector credential rotation."
    legacy_removal_version: phase-8-sidecar
  - key: knowledge.parsers.items.llama_parse_cloud
    kind: config-and-credential-binding
    current_readers: [backend/config.py, backend/knowledge/parsers/registry.py, backend/api/knowledge.py]
    current_writers: [backend/config.py, backend/knowledge/parsers/registry.py]
    secret_fields: [api_key]
    target_owner: puddingknowledge
    target_secret_backend: platform-managed-vault
    migration: "Convert api_key to credential_ref; validate binding before cutover."
    rotation: "Platform connector credential rotation."
    legacy_removal_version: phase-8-sidecar
  - key: database.password
    kind: database-credential
    current_readers: [backend/config.py, backend/knowledge/database_sources.py, backend/analytics/nl2sql]
    current_writers: [backend/config.py, backend/api/knowledge.py]
    secret_fields: [password, password_ref]
    target_owner: puddingknowledge
    target_secret_backend: platform-managed-vault
    migration: "Split source metadata from secret_ref; rebind target credential before deployment cutover."
    rotation: "Database credential rotation with connection health check."
    legacy_removal_version: phase-8-sidecar
  - key: knowledge.feishu.app_credentials
    kind: oauth-credential-set
    current_readers: [backend/api/feishu_connector.py, backend/knowledge/connectors/feishu.py]
    current_writers: [backend/api/feishu_connector.py, backend/knowledge/connectors/feishu.py]
    secret_fields: [app_secret, access_token, refresh_token, verifier]
    target_owner: puddingknowledge
    target_secret_backend: platform-managed-vault
    migration: "Move ciphertext/token material by credential reference; retain Feishu metadata and grant IDs in Platform Catalog."
    rotation: "App secret and OAuth grant rotation with token_version bump."
    legacy_removal_version: phase-8-sidecar
  - key: providers.*.credentials
    kind: model-provider-credential
    current_readers: [backend/provider_registry.py, backend/config.py]
    current_writers: [backend/provider_registry.py, backend/config.py, frontend/src/lib/settingsApi.ts]
    secret_fields: [api_key, token]
    target_owner: split
    target_secret_backend: existing-provider-vault-then-platform-vault
    migration: "Harness retains LLM credentials; Platform receives only credentials required by its own provider workloads."
    rotation: "Owner-specific rotation; no shared database row or plaintext package export."
    legacy_removal_version: phase-10-repository-extraction
