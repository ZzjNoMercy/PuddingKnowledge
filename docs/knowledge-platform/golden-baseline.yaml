format: agent-knowledge-platform-golden-baseline/v1
spec_revision: v0.7
status: coverage-registry-not-yet-frozen
principle: "A golden baseline must compare normalized outputs, evidence and side effects against a frozen source snapshot; existing tests are mapped here first and are not silently treated as that snapshot."
