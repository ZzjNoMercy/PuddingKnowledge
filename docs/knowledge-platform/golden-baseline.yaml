freeze_requirements:
  - normalized_result_digest
  - evidence_and_provenance_digest
  - database_side_effect_digest
  - filesystem_side_effect_digest
  - provider_and_index_revision
  - failure_and_retry_semantics
  - sanitized_fixture_manifest
status_reason: "Phase 0A maps current coverage; freeze is blocked until source snapshot, sanitized fixtures and normalized digest harness exist. Legacy Catalog rehearsal is executable but still uses the shared legacy Base."
