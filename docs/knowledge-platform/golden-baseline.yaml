    command: "backend/.venv/bin/pytest -q backend/tests/test_catalog_migration.py backend/tests/test_catalog_backup.py"
    expected_scope: [sqlite-roundtrip, interrupted-import-rollback, content-digest, atomic-config-switch, backup-restore]
