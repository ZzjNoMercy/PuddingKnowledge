foreign_key_policy:
  current: "Inventory current FK graph before any move."
  target: "Only intra-owner FK; cross-owner references become stable IDs/URIs with application-level validation."
verification:
  row_counts: required
  primary_key_sets: required
  normalized_content_digests: required
  foreign_key_integrity: required
  file_reference_reachability: required
  lease_state: required
  secret_redaction: required
  active_revision_switch: "single compare-and-swap pointer; never multi-process environment edits"
status: rehearsal-slices-implemented-production-migration-open
