name: Independent repository checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --no-editable --all-extras
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: packages/knowledge-platform-web
      - run: uv run --no-sync python -m pytest -q
        working-directory: backend
  frontend-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test && npm run build
        working-directory: packages/knowledge-platform-web
      - run: npm run build && npm test
        working-directory: packages/knowledge-platform-console
      - run: npm test
        working-directory: packages/knowledge-platform-console-contracts
      - run: npm test
        working-directory: packages/knowledge-platform-deploy-cli
      - run: npm test
        working-directory: packages/knowledge-platform-skills
  local-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --project backend --locked --no-editable
      - run: uv run --project backend --no-sync python integration/local_service_smoke.py --repo "$PWD" --fixture-python "$PWD/backend/.venv/bin/python" --capture
      - run: '"$GITHUB_WORKSPACE/backend/.venv/bin/python" -m pytest "$GITHUB_WORKSPACE/backend/tests/test_knowledge_platform_wiki_process.py" -q'
        working-directory: /tmp
        env:
          KNOWLEDGE_TEST_INSTALLED: '1'
      - run: '"$GITHUB_WORKSPACE/backend/.venv/bin/python" -m pytest "$GITHUB_WORKSPACE/backend/tests/test_knowledge_platform_read_later_runtime.py" -k real_process -q'
        working-directory: /tmp
        env:
          KNOWLEDGE_TEST_INSTALLED: '1'
      - run: '"$GITHUB_WORKSPACE/backend/.venv/bin/python" -m pytest "$GITHUB_WORKSPACE/backend/tests/test_knowledge_platform_feishu_runtime.py" -q'
        working-directory: /tmp
        env:
          KNOWLEDGE_TEST_INSTALLED: '1'
      - run: '"$GITHUB_WORKSPACE/backend/.venv/bin/python" -m pytest "$GITHUB_WORKSPACE/backend/tests/test_knowledge_platform_oauth_runtime.py" -q'
        working-directory: /tmp
        env:
          KNOWLEDGE_TEST_INSTALLED: '1'
      - run: '"$GITHUB_WORKSPACE/backend/.venv/bin/python" -m pytest "$GITHUB_WORKSPACE/backend/tests/test_knowledge_platform_bitable_runtime.py" -q'
        working-directory: /tmp
        env:
          KNOWLEDGE_TEST_INSTALLED: '1'
